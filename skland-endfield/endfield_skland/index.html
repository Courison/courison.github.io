<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终末地绑定信息测试</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f4f6f8;
            color: #222;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 6px 0;
            color: #1a2a3a;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #e8ecf0;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 1rem;
            margin: 0 0 12px 0;
            color: #1a2a3a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .form-row input {
            flex: 1;
            min-width: 240px;
            padding: 10px 14px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Consolas', 'Monaco', monospace;
            outline: none;
        }
        .form-row input:focus { border-color: #3f7e6b; }
        .btn {
            background: #3f7e6b;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #2f5b50; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn.secondary {
            background: #eef2f6;
            color: #3f7e6b;
        }
        .btn.secondary:hover { background: #dce2ea; }
        .status {
            font-size: 0.85rem;
            min-height: 1.4em;
            margin-top: 6px;
        }
        .status.err { color: #c0392b; }
        .status.ok { color: #3f7e6b; }
        .status.info { color: #555; }

        .hint {
            font-size: 0.78rem;
            color: #888;
            line-height: 1.6;
            background: #f8fafc;
            border-left: 3px solid #3f7e6b;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .hint code {
            background: #eef2f7;
            padding: 1px 5px;
            border-radius: 3px;
            color: #c0392b;
            font-size: 0.85em;
        }

        pre.json {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-family: 'Consolas', 'Monaco', monospace;
            overflow: auto;
            max-height: 600px;
            line-height: 1.6;
            margin: 0;
        }
        .highlight {
            background: #3f7e6b;
            color: #fff;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .key { color: #9cdcfe; }
        .str { color: #ce9178; }
        .num { color: #b5cea8; }
        .bool { color: #569cd6; }
        .null { color: #569cd6; }
        .punct { color: #d4d4d4; }

        .highlight-box {
            background: #fff8e6;
            border: 1px solid #ffd86b;
            border-left: 4px solid #f0b400;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 12px;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #5f4400;
        }
        .highlight-box strong { color: #8a5e00; }
        .highlight-box code {
            background: rgba(255,255,255,0.6);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.85em;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .summary-table th, .summary-table td {
            border: 1px solid #e8ecf0;
            padding: 6px 10px;
            text-align: left;
        }
        .summary-table th {
            background: #f8fafc;
            color: #555;
            font-weight: 600;
        }
        .summary-table td code {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #c0392b;
            background: #fef2f2;
            padding: 1px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 终末地绑定信息测试</h1>
    <div class="subtitle">
        用于查看森空岛 <code>/api/v1/game/player/binding</code> 接口返回的原始 JSON，确认终末地的 <code>uid</code> / <code>nickName</code> / <code>roles[]</code> 结构。
    </div>

    <div class="card">
        <h2>① 输入凭证</h2>
        <div class="form-row">
            <input type="text" id="credInput" placeholder="cred（32 位）">
            <input type="text" id="tokenInput" placeholder="token（32 位）">
        </div>
        <div class="form-row">
            <button class="btn" id="queryBtn">查询绑定信息</button>
            <button class="btn secondary" id="clearBtn">清空</button>
        </div>
        <div id="status" class="status info"></div>
        <div class="hint">
            凭证获取方式：森空岛官网登录后，在浏览器 F12 控制台执行：<br>
            <code>copy(localStorage.getItem('SK_OAUTH_CRED_KEY')+','+localStorage.getItem('SK_TOKEN_CACHE_KEY'))</code><br>
            然后粘贴到上方两个输入框（用英文逗号分隔）。
        </div>
    </div>

    <div class="card">
        <h2>② 终末地关键字段</h2>
        <div id="summary">
            <div style="color:#999; font-size:0.85rem;">尚无数据</div>
        </div>
    </div>

    <div class="card">
        <h2>③ 原始 JSON</h2>
        <pre class="json" id="jsonOutput">等待查询…</pre>
    </div>
</div>

<script>
(function() {
    'use strict';

    const credInput = document.getElementById('credInput');
    const tokenInput = document.getElementById('tokenInput');
    const queryBtn = document.getElementById('queryBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const jsonOutput = document.getElementById('jsonOutput');
    const summaryEl = document.getElementById('summary');

    // 与当前页面同源，避免 CORS
    // 5001 的 /api/skland/binding 接受 { cred, token }
    const API_BASE = '';

    function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = 'status ' + (cls || 'info');
    }

    function parseInput() {
        let cred = credInput.value.trim();
        let token = tokenInput.value.trim();

        // 如果用户只在一个框里粘贴了 "cred,token" 格式，自动拆分
        if (cred && !token && cred.includes(',')) {
            const parts = cred.split(/[,，]/).map(s => s.trim());
            cred = parts[0] || '';
            token = parts[1] || '';
            credInput.value = cred;
            tokenInput.value = token;
        }
        return { cred, token };
    }

    // JSON 语法高亮
    function syntaxHighlight(json) {
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(
            /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
            function(match) {
                let cls = 'num';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'str';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'bool';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            }
        );
    }

    function renderSummary(data) {
        const list = (data && data.data && data.data.list) || [];
        const endfield = list.find(x => x.appCode === 'endfield');

        if (!endfield) {
            summaryEl.innerHTML = '<div style="color:#c0392b; font-size:0.85rem;">未找到 appCode=endfield 的绑定项</div>';
            return;
        }

        const bl = (endfield.bindingList || [])[0] || {};
        const roles = bl.roles || [];
        const role = roles[0] || {};

        summaryEl.innerHTML = `
            <div class="highlight-box">
                <strong>⚠️ 关键结论：</strong><br>
                终末地的 <code>nickName</code> <b>可能为空</b>，此时真实角色昵称在 <code>roles[0].nickname</code>；<br>
                终末地的 <b>游戏 UID</b> 应该是 <code>roles[0].roleId</code>，而不是 <code>defaultUid</code>（后者是森空岛绑定 ID）。
            </div>
            <table class="summary-table">
                <tr><th>字段</th><th>值</th><th>说明</th></tr>
                <tr><td><code>appCode</code></td><td>${endfield.appCode || ''}</td><td>应用标识</td></tr>
                <tr><td><code>appName</code></td><td>${endfield.appName || ''}</td><td>应用名</td></tr>
                <tr><td><code>defaultUid</code></td><td>${endfield.defaultUid || ''}</td><td>森空岛绑定 ID（非游戏内 UID）</td></tr>
                <tr><td><code>bindingList[0].uid</code></td><td>${bl.uid || ''}</td><td>森空岛侧 UID</td></tr>
                <tr><td><code>bindingList[0].nickName</code></td><td>${bl.nickName === '' ? '<span style="color:#c0392b;">（空字符串）</span>' : (bl.nickName || '（无此字段）')}</td><td>终末地账号昵称，常常为空</td></tr>
                <tr><td><code>bindingList[0].channelName</code></td><td>${bl.channelName || ''}</td><td>渠道名</td></tr>
                <tr><td><code>roles.length</code></td><td>${roles.length}</td><td>角色数量</td></tr>
                <tr><td><code>roles[0].nickname</code></td><td><b style="color:#3f7e6b;">${role.nickname || ''}</b></td><td>角色昵称（推荐用作显示名）</td></tr>
                <tr><td><code>roles[0].roleId</code></td><td><b style="color:#3f7e6b;">${role.roleId || ''}</b></td><td>游戏内 UID（推荐）</td></tr>
                <tr><td><code>roles[0].serverId</code></td><td>${role.serverId || ''}</td><td>服务器 ID</td></tr>
                <tr><td><code>roles[0].serverName</code></td><td>${role.serverName || ''}</td><td>服务器名</td></tr>
                <tr><td><code>roles[0].level</code></td><td>${role.level || ''}</td><td>等级</td></tr>
                <tr><td><code>roles[0].isDefault</code></td><td>${role.isDefault === undefined ? '' : role.isDefault}</td><td>是否默认角色</td></tr>
            </table>
        `;
    }

    async function query() {
        const { cred, token } = parseInput();
        if (!cred || !token) {
            setStatus('请填写完整的 cred 和 token', 'err');
            return;
        }
        if (cred.length !== 32 || token.length !== 32) {
            setStatus(`长度异常：cred=${cred.length}, token=${token.length}`, 'err');
            return;
        }

        queryBtn.disabled = true;
        queryBtn.textContent = '查询中…';
        setStatus('正在请求 /api/skland/binding …', 'info');
        jsonOutput.textContent = '加载中…';
        summaryEl.innerHTML = '<div style="color:#999; font-size:0.85rem;">加载中…</div>';

        try {
            const resp = await fetch(API_BASE + '/api/skland/binding', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cred, token })
            });
            const text = await resp.text();
            let json;
            try {
                json = JSON.parse(text);
            } catch (e) {
                setStatus('响应不是 JSON：' + text.slice(0, 200), 'err');
                jsonOutput.textContent = text;
                return;
            }

            jsonOutput.innerHTML = syntaxHighlight(JSON.stringify(json, null, 2));
            renderSummary(json);

            if (json.code === 0) {
                setStatus('✅ 查询成功', 'ok');
            } else {
                setStatus(`❌ 接口返回：code=${json.code}, message=${json.message || ''}`, 'err');
            }
        } catch (e) {
            setStatus('❌ 请求失败：' + e.message, 'err');
            jsonOutput.textContent = String(e);
        } finally {
            queryBtn.disabled = false;
            queryBtn.textContent = '查询绑定信息';
        }
    }

    function clearAll() {
        credInput.value = '';
        tokenInput.value = '';
        setStatus('');
        jsonOutput.textContent = '等待查询…';
        summaryEl.innerHTML = '<div style="color:#999; font-size:0.85rem;">尚无数据</div>';
    }

    queryBtn.addEventListener('click', query);
    clearBtn.addEventListener('click', clearAll);
    credInput.addEventListener('keydown', e => { if (e.key === 'Enter') tokenInput.focus(); });
    tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') query(); });
})();
</script>
</body>
</html>
