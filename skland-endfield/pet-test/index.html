<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>捏捏角色 · 独立测试</title>
    <link rel="stylesheet" href="./pet.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f4f6f8;
            color: #222;
        }
        .test-header {
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid #e8ecf0;
            font-weight: 600;
            font-size: 1.1rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .test-main { padding: 24px; max-width: 900px; margin: 0 auto; }
        .test-card {
            background: #fff;
            border: 1px solid #e8ecf0;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
        }
        .test-card h2 { margin: 0 0 8px 0; font-size: 1rem; color: #1a2a3a; }
        .test-card p { margin: 0; font-size: 0.9rem; color: #555; line-height: 1.7; }
        .test-log {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, Monaco, monospace;
            font-size: 0.82rem;
            border-radius: 10px;
            padding: 12px 16px;
            min-height: 100px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .test-log .ts { color: #6ba08e; }
        .test-log .action { color: #f0c040; }
    </style>
</head>
<body>

<header class="test-header">🐋 捏捏角色 · 独立测试（v2）</header>

<main class="test-main">
    <div class="test-card">
        <h2>测试说明</h2>
        <p>
            1. 点击右下角角色，观察缩放动画与气泡。<br>
            2. 拖动角色到左半侧，验证自动水平镜像。<br>
            3. 点击右上角小齿轮，调整大小（小 / 中 / 大 / 特大）。<br>
            4. 点击气泡里的「导出排班」「意见反馈」，观察日志。<br>
            5. 静止 45 秒，观察是否主动说话。
        </p>
    </div>
    <div class="test-card">
        <h2>事件日志</h2>
        <div class="test-log" id="testLog">等待交互…</div>
    </div>
</main>

<script>
    // 模拟主站把导出、反馈逻辑暴露为全局函数
    (function() {
        const logEl = document.getElementById('testLog');
        function log(action, detail) {
            const now = new Date();
            const ts = String(now.getHours()).padStart(2,'0') + ':' +
                       String(now.getMinutes()).padStart(2,'0') + ':' +
                       String(now.getSeconds()).padStart(2,'0');
            const line = document.createElement('div');
            line.innerHTML = `<span class="ts">[${ts}]</span> <span class="action">${action}</span> ${detail || ''}`;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }
        window.__testLog = log;

        // 主站正式版里，这两个函数会在 main.js 中定义
        window.DijiangExportSchedule = function() {
            log('导出排班', '（模拟主站导出逻辑）');
        };
        window.DijiangOpenFeedback = function() {
            log('意见反馈', '（模拟打开反馈弹窗）');
        };
    })();
</script>

<script src="./pet.js"></script>

</body>
</html>
